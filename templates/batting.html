{% extends "base.html" %}
{% block content %}

<h2 class="mt-3 mb-3">Batting Statistics</h2>
<form class="row gy-2 gx-3 align-items-center mb-4" method="get">
    <div class="col-auto flex-grow-1" style="min-width:100px;">
        <input type="number" class="form-control" name="min_innings" value="{{ min_innings }}" min="1" placeholder="Min Innings">
    </div>
    <div class="col-auto flex-grow-1" style="min-width:110px;">
        <select name="innings_filter" class="form-select">
            <option value="0" {% if innings_filter==0 %}selected{% endif %}>All Innings</option>
            <option value="1" {% if innings_filter==1 %}selected{% endif %}>1st Innings</option>
            <option value="2" {% if innings_filter==2 %}selected{% endif %}>2nd Innings</option>
        </select>
    </div>
    <div class="col-auto flex-grow-1" style="min-width:120px;">
        <select name="season" class="form-select">
            <option value="all" {% if season == 'all' %}selected{% endif %}>All Seasons</option>
            {% for s in seasons %}
            <option value="{{ s }}" {% if season == s %}selected{% endif %}>{{ s }}</option>
            {% endfor %}
        </select>
    </div>
    <input type="hidden" name="league" value="{{ league }}">
    <div class="col-auto">
        <button class="btn btn-primary w-100" type="submit">Apply Filters</button>
    </div>
</form>

<div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
        <thead class="table-dark">
            <tr>
                <th>Batsman</th>
                <th>Innings</th>
                <th>Runs</th>
                <th>Balls</th>
                <th>Strike Rate</th>
                <th>RPI</th>
                <th>BPB</th>
                <th>BPD</th>
            </tr>
        </thead>
        <tbody>
            {% for stat in stats %}
            <tr>
                <td>{{ stat.batsman }}</td>
                <td>{{ stat.innings }}</td>
                <td>{{ stat.runs }}</td>
                <td>{{ stat.balls }}</td>
                <td>{{ stat.SR }}</td>
                <td>{{ stat.RPI }}</td>
                <td>{{ stat.BPB }}</td>
                <td>{{ stat.BPD }}</td>
            </tr>
            {% endfor %}
        </tbody>
    </table>
</div>
<style>
@media (max-width: 576px) {
    h2 { font-size: 1.25rem; }
    .table-responsive { font-size: 13px; }
    .form-control, .form-select, .btn { font-size: 14px; }
}
</style>
{% endblock %}
